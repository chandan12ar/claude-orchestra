name: Bug report
description: Something in Cuelight does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Cuelight version
      description: From `/plugin`, or `.claude-plugin/plugin.json`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Claude Code version, operating system, Python version, browser
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "`python -m orchestra --demo` is a good way to show a problem without sharing a real session."
  - type: markdown
    attributes:
      value: "Please do not paste transcripts, tokens or private paths. Security problems: use the private reporting link in SECURITY.md, not an issue."
